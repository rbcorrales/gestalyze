version: 2

# Version updates run monthly and skip major versions. Majors (React, Tailwind,
# Vite, mediapipe, numpy, etc.) are handled deliberately by hand.
# Security alerts and security update PRs are independent of this schedule and
# still fire immediately when an advisory matches the dependency graph.

updates:
  # Python backend and training dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # opencv-python >= 4.12 hard-requires numpy 2. Lift once numpy 2 is adopted.
      - dependency-name: "opencv-python"
        versions: [">=4.12"]
      # mediapipe >= 0.10.30 removed the legacy mp.solutions API that backend/main.py
      # uses. Lift once the backend migrates to the Tasks API (HandLandmarker).
      - dependency-name: "mediapipe"
        versions: [">=0.10.30"]

  # Public website (Vite + React)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      website-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Frontend web app (Vite + React)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
